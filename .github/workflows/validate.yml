name: Validate dotfiles

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          bash -n install.sh tests/test-install.sh
          zsh -n configs/.zprofile configs/.zshrc
      - name: Exercise the installer twice
        run: tests/test-install.sh
