add_newline = false
command_timeout = 1000
follow_symlinks = false

format = """╭╴$hostname$os$directory$git_branch$git_status$git_state$golang$java$nodejs$python$swift$fill$time$sudo
$character"""

[fill]
symbol = " "

[character]
format = "$symbol "
success_symbol = "╰⎯"
error_symbol = "╰⎯"

[hostname]
ssh_only = true
format = "[ SSH:]($style)"
style = "bold #708090"

[os]
disabled = false
format = "[$symbol ](bold white)"

[os.symbols]
Macos = ""

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
home_symbol = "󰋜 ~"
read_only = "  "
read_only_style = "#ff6347"
style = "#3498db"
truncation_symbol = "…/"

[git_branch]
format = "on [$symbol $branch]($style)"
style = "#ff69b4"
symbol = ""
truncation_symbol = "…/"

[git_status]
ahead = " ⇡${count}"
behind = " ⇣${count}"
conflicted = " 🏳"
deleted = " "
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"
format = "[$all_status$ahead_behind]($style) "
modified = " "
renamed = " 󰑕"
staged = ' [++\($count\)](#ff6347)'
stashed = " "
style = "#ff6347"
untracked = " "
up_to_date = ""

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style)'
style = "#9370db"

[golang]
symbol = ""

[java]
symbol = ""

[nodejs]
symbol = ""

[python]
symbol = ""

[swift]
symbol = ""

[time]
disabled = false
format = "[ $time]($style) "
style = "bold #ffb86c"
time_format = "%R"

[sudo]
disabled = false
format = "as [$symbol sudo]($style) "
style = "bold #ff6347"
symbol = ""
